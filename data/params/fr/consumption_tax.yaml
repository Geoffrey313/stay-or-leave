# Taxe sur la consommation, France. Intrant du bloc D3 (coût de la vie, indice IC_p),
# PAS du bloc D1 (cascade θ). θ est défini hors TVA ; les niveaux de prix comparatifs
# OCDE qui fondent IC_p sont déjà TVA incluse, donc la TVA ne vit qu'ici, une seule fois.
# Ce taux effectif ne sert qu'à DÉCOMPOSER IC_p si besoin, jamais à amputer θ.
effective_vat_rate: 0.12   # statut [E] estimé, à sourcer
provenance: "estimé ; à sourcer sur OCDE Consumption Tax Trends (VAT Revenue Ratio x taux standard) ou INSEE comptes des ménages"
vintage: 2024
